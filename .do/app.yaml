# DigitalOcean App Platform spec (the same settings as the web console).
# Values marked SECRET: set them in the console (Settings -> Environment Variables -> Encrypt).
# Never commit real passwords or keys in this file.
name: damodar
region: blr
services:
  - name: damodar
    github:
      repo: varsha-m-deep-dive/Damodar
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1            # keep 1: data cache and scheduled export live in the container
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/auth/config   # does not touch the database (keeps Neon able to sleep)
      initial_delay_seconds: 20
    envs:
      # database (Neon)
      - {key: PGHOST, value: ep-morning-sound-aujg3fb5-pooler.c-10.us-east-1.aws.neon.tech}
      - {key: PGDATABASE, value: easyreports4.0_tally_abd296b5203a437aa233f12df68280b0}
      - {key: PGUSER, value: neondb_owner}
      - {key: PGPASSWORD, type: SECRET, value: SET_IN_CONSOLE}
      - {key: PGSSLMODE, value: require}
      - {key: PGCHANNELBINDING, value: require}
      - {key: PGSCHEMA, value: public}
      # sign-in
      - {key: AUTH_SECRET, type: SECRET, value: SET_IN_CONSOLE}
      - {key: ADMIN_EMAIL, value: SET_IN_CONSOLE}
      - {key: ADMIN_PASSWORD, type: SECRET, value: SET_IN_CONSOLE}
      - {key: FRONTEND_URL, value: https://YOUR-PROJECT.vercel.app}
      - {key: ALLOWED_ORIGINS, value: https://YOUR-PROJECT.vercel.app}
      # Google Sheets
      - {key: GOOGLE_SERVICE_ACCOUNT_JSON, type: SECRET, value: SET_IN_CONSOLE}
      - {key: USERS_SHEET_ID, value: SET_IN_CONSOLE}
      - {key: KPI_SHEET_ID, value: SET_IN_CONSOLE}
      - {key: SHEETS_EXPORT_INTERVAL_MINUTES, value: "60"}
      # email
      - {key: EMAIL_PROVIDER, value: smtp}
      - {key: SMTP_USER, value: SET_IN_CONSOLE}
      - {key: SMTP_PASSWORD, type: SECRET, value: SET_IN_CONSOLE}
